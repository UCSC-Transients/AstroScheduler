name: Run Tests

on:
  push:
    branches: [ main, master ]
  # Every PR, including PRs stacked on another feature branch.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: |
        python -m playwright install --with-deps chromium

    - name: Run tests
      run: |
        PYTHONPATH=. pytest

  # The library as YSE_PZ installs it: Python 3.8, YSE_PZ's pins, no web framework.
  # YSE_PZ's requirements.txt pins astropy 5.2.2; its docker lock still has 5.0.
  py38-pins:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        astropy-version: ["5.0", "5.2.2"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: "3.8"
        cache: 'pip'

    - name: Install YSE_PZ's pins and the package without extras
      run: |
        python -m pip install --upgrade pip
        pip install "astropy==${{ matrix.astropy-version }}" astroplan==0.8 numpy==1.22.4 pytz==2018.3 pytest
        pip install --no-deps -e .

    - name: Library imports without FastAPI
      run: |
        cd /tmp && python -c "import sys, astroscheduler, astroscheduler.core as c; assert c.HAS_ASTRO_LIBS; assert 'fastapi' not in sys.modules; print(astroscheduler.__version__)"

    - name: Run solver unit tests
      run: |
        PYTHONPATH=. pytest tests/test_scheduler.py tests/test_kast_exposures.py tests/test_api.py tests/test_sites_exposures.py tests/test_iers_scope.py tests/test_frontend.py tests/test_yse_pz_import.py tests/test_performance.py
